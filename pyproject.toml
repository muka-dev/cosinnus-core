    "wagtail @ git+https://github.com/wechange-eg/wagtail.git@django-update-4-2",
    "django-clamd @ git+https://github.com/wechange-eg/django-clamd.git@master",
]

[project.urls]
Homepage = "https://wechange.coop/"
Repository = "https://git.wechange.de/gl/code/cosinnus"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = [
    "ajax_forms",
    "announcements",
    "cosinnus",
    "cosinnus_cloud",
    "cosinnus_conference",
    "cosinnus_etherpad",
    "cosinnus_event",
    "cosinnus_exchange",
    "cosinnus_file",
    "cosinnus_marketplace",
    "cosinnus_message",
    "cosinnus_note",
    "cosinnus_notifications",
    "cosinnus_oauth_client",
    "cosinnus_organization",
    "cosinnus_poll",
    "cosinnus_stream",
    "cosinnus_todo",
    "postman",
    "rest_framework_rdf",
    "suit_overextends",
    "wagtail_overextends",
]

[tool.ruff]
# Set the maximum line length to 120.
line-length = 120
exclude = [
    '.eggs',
    '.git',
    'migrations',
    'node_modules',
]
force-exclude = true

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.flake8-quotes]
# Use single quotes
inline-quotes = "single"
multiline-quotes = "single"


[tool.ruff.lint]
# lint rules suggested by the ruff documentation
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # isort
    "I",
]
