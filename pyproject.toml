[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cosinnus"
version = "2.5.9"
description = "cosinnus core application"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "wechange eG", email = "support@wechange.de" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.8",
    "Framework :: Django",
]
dependencies = [
    "Django>=4.2.24,<4.3",
    "MarkupSafe==2.1.5",
    "Pillow==10.3.0",
    "celery==5.2.7",
    "dataclasses",
    "beautifulsoup4==4.8.1",
    "chardet==3.0.4",
    "django-allauth==0.60.0",
    "django-annoying==0.7.6",
    "django-appconf==1.0.3",
    "django-bootstrap3==21.1",
    "django-classy-tags==2.0.0",
    "django-countries==7.2.1",
    "django-cron==0.6.0",
    "django-embed-video==1.4.9",
    "django-el-pagination==2.1.2",
    "django-extensions==3.1.5",
    "django-extra-views==0.14.0",
    "django-filter==21.1",
    "django-haystack==3.2.1",
    "django-honeypot==0.9.0",
    "django-ical==1.7.1",
    "django-mailbox==4.9.0",
    "django-modelcluster==5.2",
    "django-model-utils==1.5.0",
    "django-mptt==0.8.7",
    "django-oauth-toolkit==2.3.0",
    "django-otp==1.1.1",
    "django-phonenumber-field==6.4.0",
    "django-polymorphic==0.7.2",
    "django-reverse-admin==2.9.4",
    "django-sekizai==2.0.0",
    "django-simple-captcha==0.5.20",
    "django-taggit==1.5.1",
    "django-timezone-field==4.2.1",
    "django-two-factor-auth==1.14.0",
    "django-widget-tweaks==1.4.9",
    "djangorestframework==3.15.2",
    "djangorestframework-csv==2.1.1",
    "djangorestframework-jwt==1.11.0",
    "dnspython==2.6.1",
    "drf-extra-fields==3.4.0",
    "drf-yasg==1.21.7",
    "easy-thumbnails==2.8.5",
    "elasticsearch==7.17.9",
    "ecdsa==0.18.0",
    "geopy==1.11.0",
    "icalendar==5.0.12",
    "jsonfield==3.1.0",
    "l18n==2021.3",
    "lxml>=4.9.3",
    "html5lib",
    "html2text==2016.9.19",
    "numpy>=1.26.4",
    "oauthlib==3.2.2",
    "paramiko==2.11.0",
    "pycountry==20.7.3",
    "raven==6.9.0",
    "redis==5.0.1",
    "requests==2.32.3",
    "requests-oauthlib==0.8.0",
    "rocketchat-API==1.30.0",
    "six==1.12.0",
    "sqlparse==0.5.0",
    "sentry-sdk==1.4.2",
    "python-dateutil==2.4.1",
    "urllib3==1.26.19",
    "pytz==2022.6",
    "rdflib==5.0.0",
    "pymemcache==4.0.0",
    "qrcode==6.1",
    "Unidecode==0.4.21",
    "XlsxWriter==1.3.7",
    "django-cors-headers<3.11.0",
    "phonenumbers==8.13.28",
