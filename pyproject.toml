    "pre-commit==3.5.0",
    "django-awesome-avatar @ git+https://github.com/wechange-eg/django-awesome-avatar.git@django-update-4-2",
    "django-filer @ git+https://github.com/wechange-eg/django-filer.git@django-update-4-2",
    "django-multiform @ git+https://github.com/wechange-eg/django-multiform.git@master",
    "django-djajax @ git+https://github.com/wechange-eg/django-djajax.git@django-update-4-2",
    "django_select2 @ git+https://github.com/wechange-eg/django-select2.git@django-update-4-2",
    "django-osm-field @ git+https://github.com/wechange-eg/django-osm-field.git@django-update-4-2",
    "markdown2 @ git+https://github.com/wechange-eg/python-markdown2.git@2.4.8-WE",
    "pydkim @ git+https://github.com/wechange-eg/pydkim.git@master",
    "django-suit @ git+https://github.com/wechange-eg/django-suit.git@django-update-4-2",
